# Production stack: Caddy (TLS) → API → Postgres. Only Caddy publishes ports.
name: bistro

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bistro
      POSTGRES_USER: bistro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bistro -d bistro"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    memswap_limit: 512m
    <<: *hardening
    logging: *logging

  api:
    build:
      context: ../backend
    image: bistro-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BISTRO_ENVIRONMENT: production
      BISTRO_DATABASE_URL: postgresql+psycopg://bistro:${POSTGRES_PASSWORD}@db:5432/bistro
      BISTRO_JWT_SECRET: ${BISTRO_JWT_SECRET:?set in .env.prod}
      BISTRO_LOG_LEVEL: INFO
      BISTRO_WORKERS: "2"
      # Only Caddy (on the edge network) may set forwarding headers.
      BISTRO_TRUSTED_PROXIES: 172.30.0.0/24
      # Browser sign-in endpoints accept only requests from the web app on this exact origin.
      BISTRO_WEB_ORIGIN: https://${BISTRO_DOMAIN:?set in .env.prod}
    networks: [backend, edge]
    mem_limit: 640m
    memswap_limit: 640m
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    <<: *hardening
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BISTRO_DOMAIN: ${BISTRO_DOMAIN:?set in .env.prod}
    volumes:
      # A directory mount, so an updated Caddyfile (rsync writes a new file) is visible
      # inside the running container and `caddy reload` picks it up.
      - ./caddy:/etc/caddy:ro
      - ../web-dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    mem_limit: 128m
    memswap_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    <<: *hardening
    logging: *logging

networks:
  backend:
    internal: true   # the database has no route in or out
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
